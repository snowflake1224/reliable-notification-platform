worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;
  limit_req_zone $binary_remote_addr zone=demo:1m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=demo_sensitive:1m rate=3r/s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  upstream nplat_api {
    least_conn;
    server api-1:3000;
    server api-2:3000;
  }

  server {
    listen 80;
    client_max_body_size 64k;

    location /health/ {
      proxy_pass http://nplat_api;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /docs/ {
      proxy_pass http://nplat_api;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Prometheus scrapes API containers on the private network.
    location = /metrics {
      return 404;
    }

    location /admin/ {
      limit_req zone=demo burst=20 nodelay;
      proxy_pass http://nplat_api;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
      limit_req zone=demo burst=20 nodelay;
      proxy_pass http://nplat_api;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 2s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
    }

    location /simulate {
      limit_req zone=demo_sensitive burst=6 nodelay;
      proxy_pass http://provider-simulator:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /mailpit/ {
      limit_req zone=demo_sensitive burst=10 nodelay;
      proxy_pass http://mailhog:8025;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # Shared site header (see apps/api/src/ui/siteHeader.ts). Mailpit's CSP allows external and inline styles.
      proxy_set_header Accept-Encoding "";
      sub_filter '</head>' '<link rel="stylesheet" href="/console/site.css"><style>body.site{display:flex;flex-direction:column;height:100%}body.site>#app{flex:1 1 auto;min-height:0;height:auto!important}</style></head>';
      sub_filter '<body class="h-100">' '<body class="h-100 site"><header class="site-header"><div class="site-header__inner"><a class="site-brand" href="/"><span class="site-brand__mark"></span><span class="site-brand__text">Reliable Notification Platform</span></a><nav class="site-nav" aria-label="Project pages"><a href="/">Home</a><a href="/console/">Console</a><a href="/console/inbox/" aria-current="page">Inbox</a><a href="/docs/">API docs</a></nav></div></header>';
    }

    location = / {
      proxy_pass http://nplat_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Accept $http_accept;
    }

    location /console/ {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /console/index.html;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ =404;
    }
  }
}
